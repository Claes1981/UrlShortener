apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
spec:
  replicas: 3
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
        - name: beacon
          image: beacon:v1
          ports:
            - containerPort: 8080
            